name: context
# triggrs
on: 
  push:
env:
  project: "roboshop"
  component: "catalogue"
  environment: dev

jobs: # stages
  my-job: # stage
    runs-on: ubuntu-latest # agent, ubuntu-latest is github hosted github runner
    steps:
      - name: print env variable
        run: |
           echo "Project: $project"
           echo "Component: $component"

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: add variable to  env
        run: |
           echo "course=github actions" >> $GITHUB_ENV
           echo "duration=5hours" >> $GITHUB_ENV

      - name: access another step variables
        run: |
           echo "course: $course"